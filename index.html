<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Night Fury - Toothless Plasma Edition</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #04050a;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }

  .hud {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    padding: 9px 20px;
    border-radius: 99px;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 0.85rem;
    color: rgba(215, 235, 255, 0.8);
    background: rgba(8, 12, 24, 0.72);
    border: 1px solid rgba(170, 90, 255, 0.35);
    box-shadow: 0 0 20px rgba(140, 60, 255, 0.25);
    backdrop-filter: blur(8px);
    pointer-events: none;
    transition: opacity 0.9s ease;
    white-space: nowrap;
    z-index: 10;
  }

  .hud.hidden {
    opacity: 0;
  }
</style>
</head>
<body>

<canvas id="nightFuryCanvas"></canvas>
<div class="hud" id="hud">حرّك إصبعك ليحلّق غضب الليل — اضغط مطولاً لشحن وإطلاق البلازما الأرجوانية</div>

<script>
  const canvas = document.getElementById('nightFuryCanvas');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');

  let width = window.innerWidth;
  let height = window.innerHeight;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // نجوم السماء الليلية والشفق القطبي الخفيف
  const stars = Array.from({ length: 110 }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    r: 0.5 + Math.random() * 1.6,
    twinkle: Math.random() * Math.PI * 2,
    speed: 0.015 + Math.random() * 0.03
  }));

  // جسم أبو سن (Night Fury): 38 فقرة انسيابية مع ذيل طويل وزعنفة ذيل صناعية حمراء
  const N = 38;
  const elems = [];
  for (let i = 0; i < N; i++) {
    elems[i] = { x: width / 2, y: height / 2, angle: 0 };
  }

  const pointer = { x: width / 2, y: height / 2 };
  let isUserInteracting = false;
  let isPointerDown = false;
  let autoTime = 0;
  let wingPhase = 0;

  // حالات البلازما الأرجوانية والوضع الألفي (Alpha Mode)
  let chargeLevel = 0;      // 0 إلى 1 (توهج الشوكات الظهرية بالبنفسجي/الأزرق كوضع ألفا)
  let jawOpen = 0;
  let shotCooldown = 0;
  let screenShake = 0;
  let flashAlpha = 0;

  // مصفوفات التأثيرات
  const plasmaBolts = [];
  const plasmaExplosions = [];
  const lightningArcs = [];
  const sparks = [];
  const sonicRings = [];
  const wingTrailsL = [];
  const wingTrailsR = [];

  // نظام الصوت التفاعلي (صفير غضب الليل + شحن وانفجار البلازما)
  let audioCtx = null;
  let chargeOsc = null;
  let chargeGain = null;

  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      chargeOsc = audioCtx.createOscillator();
      chargeGain = audioCtx.createGain();
      chargeOsc.type = 'sine';
      chargeOsc.frequency.value = 180;
      chargeGain.gain.value = 0;
      chargeOsc.connect(chargeGain);
      chargeGain.connect(audioCtx.destination);
      chargeOsc.start();
    } catch (e) {}
  }

  function playPlasmaBlastSound() {
    try {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      // 1. صفير البلازما المميز لغضب الليل
      const whistle = audioCtx.createOscillator();
      const wGain = audioCtx.createGain();
      whistle.type = 'triangle';
      whistle.frequency.setValueAtTime(1450, now);
      whistle.frequency.exponentialRampToValueAtTime(240, now + 0.28);
      wGain.gain.setValueAtTime(0.24, now);
      wGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      whistle.connect(wGain);
      wGain.connect(audioCtx.destination);
      whistle.start(now);
      whistle.stop(now + 0.3);

      // 2. نبضة انفجار عميقة (Sub-bass thump)
      const sub = audioCtx.createOscillator();
      const sGain = audioCtx.createGain();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(130, now);
      sub.frequency.exponentialRampToValueAtTime(32, now + 0.35);
      sGain.gain.setValueAtTime(0.35, now);
      sGain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
      sub.connect(sGain);
      sGain.connect(audioCtx.destination);
      sub.start(now);
      sub.stop(now + 0.36);
    } catch (e) {}
  }

  function updatePointer(x, y) {
    isUserInteracting = true;
    hud.classList.add('hidden');
    pointer.x = x;
    pointer.y = y;
  }

  window.addEventListener('pointerdown', (e) => {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    isPointerDown = true;
    updatePointer(e.clientX, e.clientY);
  });

  window.addEventListener('pointermove', (e) => {
    if (e.buttons > 0 || e.pointerType === 'mouse' || e.pointerType === 'touch') {
      updatePointer(e.clientX, e.clientY);
    }
  });

  window.addEventListener('pointerup', () => {
    if (isPointerDown && chargeLevel > 0.25) {
      firePlasmaBlast();
    }
    isPointerDown = false;
  });

  window.addEventListener('pointercancel', () => { isPointerDown = false; });

  // إطلاق قذيفة البلازما الأرجوانية من فم أبو سن
  function firePlasmaBlast() {
    const head = elems[0];
    const scale = Math.min(width, height) < 600 ? 0.78 : 1.05;
    const mouthX = head.x + Math.cos(head.angle) * (26 * scale);
    const mouthY = head.y + Math.sin(head.angle) * (26 * scale);

    const power = 0.6 + chargeLevel * 0.8;
    const speed = 15 * scale;

    plasmaBolts.push({
      x: mouthX,
      y: mouthY,
      vx: Math.cos(head.angle) * speed,
      vy: Math.sin(head.angle) * speed,
      targetX: pointer.x,
      targetY: pointer.y,
      radius: 11 * power * scale,
      life: 1,
      history: []
    });

    // حلقة صوتية أرجوانية عند فم التنين لحظة الإطلاق
    sonicRings.push({
      x: mouthX,
      y: mouthY,
      angle: head.angle,
      radius: 6 * scale,
      alpha: 0.95,
      color: '#d580ff'
    });

    screenShake = 6 * power;
    flashAlpha = 0.22 * power;
    playPlasmaBlastSound();
    if (navigator.vibrate) navigator.vibrate([25, 20, 40]);
  }

  // توليد انفجار بلازما أرجواني مع برق كهربائي
  function triggerPlasmaExplosion(x, y, scale) {
    plasmaExplosions.push({
      x, y,
      radius: 8,
      maxRadius: 95 * scale,
      alpha: 1
    });

    // أقواس برق أرجوانية متشعبة من مركز الانفجار
    for (let b = 0; b < 7; b++) {
      const a = (Math.PI * 2 * b) / 7 + (Math.random() - 0.5) * 0.4;
      const len = (45 + Math.random() * 55) * scale;
      const pts = [{ x, y }];
      let cx = x, cy = y;
      for (let s = 1; s <= 4; s++) {
        const step = len / 4;
        cx += Math.cos(a) * step + (Math.random() - 0.5) * 18;
        cy += Math.sin(a) * step + (Math.random() - 0.5) * 18;
        pts.push({ x: cx, y: cy });
      }
      lightningArcs.push({ pts, alpha: 1 });
    }

    // شرارات بلازما متطايرة
    for (let i = 0; i < 28; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (2 + Math.random() * 7) * scale;
      sparks.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.02 + Math.random() * 0.02,
        size: (2 + Math.random() * 3.5) * scale,
        hue: 270 + Math.random() * 35 // أرجواني إلى وردي نيون
      });
    }

    screenShake = Math.max(screenShake, 7);
    flashAlpha = Math.max(flashAlpha, 0.25);
  }

  // رسم رأس أبو سن (Night Fury Head) بالزوائد الأذنية الأربعة والعيون الزمردية
  function drawToothlessHead(x, y, angle, scale, jaw, charge) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(scale, scale);

    // هالة شحن البلازما داخل الفم والحلق
    if (charge > 0.05) {
      const glow = ctx.createRadialGradient(18, 0, 1, 18, 0, 26 + charge * 14);
      glow.addColorStop(0, `rgba(255, 245, 255, ${charge})`);
      glow.addColorStop(0.35, `rgba(205, 95, 255, ${charge * 0.9})`);
      glow.addColorStop(0.75, `rgba(115, 20, 220, ${charge * 0.5})`);
      glow.addColorStop(1, 'rgba(90, 0, 180, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(18, 0, 26 + charge * 14, 0, Math.PI * 2);
      ctx.fill();
    }

    // 1. الزوائد الأذنية الخلفية الطويلة
    const earWiggle = Math.sin(autoTime * 4) * 0.05;
    for (let side of [-1, 1]) {
      ctx.save();
      ctx.scale(1, side);
      ctx.rotate(earWiggle);

      ctx.fillStyle = '#090b12';
      ctx.strokeStyle = charge > 0.2 ? `rgba(190, 110, 255, ${0.4 + charge * 0.6})` : 'rgba(65, 80, 115, 0.45)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-4, 9);
      ctx.quadraticCurveTo(-22, 16, -38, 13);
      ctx.quadraticCurveTo(-26, 23, -10, 16);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-6, 12);
      ctx.quadraticCurveTo(-20, 24, -30, 25);
      ctx.quadraticCurveTo(-18, 28, -8, 17);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    // 2. الفك السفلي
    ctx.save();
    ctx.translate(2, 0);
    ctx.rotate(jaw * 0.45);
    ctx.fillStyle = '#0c0f18';
    ctx.beginPath();
    ctx.moveTo(24, 0);
    ctx.quadraticCurveTo(14, 9, -8, 10);
    ctx.lineTo(-8, -10);
    ctx.quadraticCurveTo(14, -9, 24, 0);
    ctx.fill();

    if (jaw > 0.12) {
      ctx.fillStyle = `rgba(220, 130, 255, ${Math.min(1, jaw * 1.6)})`;
      ctx.beginPath();
      ctx.ellipse(12, 0, 10 * jaw, 6 * jaw, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 3. الرأس العريض المستدير المميز لغضب الليل
    const headGrad = ctx.createRadialGradient(6, -3, 2, 2, 0, 28);
    headGrad.addColorStop(0, '#1e2436');
    headGrad.addColorStop(0.65, '#0b0d15');
    headGrad.addColorStop(1, '#05060a');

    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.moveTo(27, 0);
    ctx.bezierCurveTo(26, -13, 12, -17, -6, -14);
    ctx.quadraticCurveTo(-14, -10, -14, 0);
    ctx.quadraticCurveTo(-14, 10, -6, 14);
    ctx.bezierCurveTo(12, 17, 26, 13, 27, 0);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = charge > 0.25 ? `rgba(180, 90, 255, ${charge * 0.7})` : 'rgba(85, 110, 155, 0.35)';
    ctx.lineWidth = 1.3;
    ctx.stroke();

    // 4. العيون الزمردية الكبيرة التعبيرية
    for (let side of [-1, 1]) {
      ctx.save();
      ctx.scale(1, side);

      const eyeColor = charge > 0.45 ? '#d980ff' : '#52ff7f';
      const eyeGlow = charge > 0.45 ? '#b324ff' : '#1aff53';

      ctx.shadowColor = eyeGlow;
      ctx.shadowBlur = 10 + charge * 8;
      ctx.fillStyle = eyeColor;

      ctx.beginPath();
      ctx.moveTo(15, 5.5);
      ctx.quadraticCurveTo(9, 12.5, 2, 9.5);
      ctx.quadraticCurveTo(7, 4.5, 15, 5.5);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#040508';
      ctx.beginPath();
      ctx.ellipse(8.5, 8.2, 2.8 - charge * 1.2, 1.9, -0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(10.2, 7.5, 0.85, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    ctx.fillStyle = charge > 0.2 ? '#e099ff' : '#2a3248';
    ctx.beginPath();
    ctx.arc(22.5, -3.2, 1.1, 0, Math.PI * 2);
    ctx.arc(22.5, 3.2, 1.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // رسم أجنحة غضب الليل العريضة والمقوسة
  function drawToothlessWings(x, y, angle, scale, charge, wingPosL, wingPosR) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(scale, scale);

    const flap = Math.sin(wingPhase) * (isPointerDown ? 0.34 : 0.24);
    const wingSpan = 165;

    for (let side of [-1, 1]) {
      ctx.save();
      ctx.scale(1, side);
      ctx.rotate(flap);

      const tipLocalX = -65;
      const tipLocalY = wingSpan;
      const worldAngle = angle + side * flap;
      const wx = x + (tipLocalX * Math.cos(worldAngle) - tipLocalY * side * Math.sin(worldAngle)) * scale;
      const wy = y + (tipLocalX * Math.sin(worldAngle) + tipLocalY * side * Math.cos(worldAngle)) * scale;
      if (side === -1) { wingPosL.x = wx; wingPosL.y = wy; }
      else { wingPosR.x = wx; wingPosR.y = wy; }

      const wingGrad = ctx.createLinearGradient(10, 0, -90, wingSpan);
      wingGrad.addColorStop(0, '#131724');
      wingGrad.addColorStop(0.55, '#090b12');
      wingGrad.addColorStop(1, '#05060a');

      ctx.fillStyle = wingGrad;
      ctx.beginPath();
      ctx.moveTo(14, 6);
      ctx.bezierCurveTo(22, 65, -15, 130, -68, wingSpan);
      ctx.quadraticCurveTo(-65, wingSpan * 0.72, -88, wingSpan * 0.65);
      ctx.quadraticCurveTo(-72, wingSpan * 0.45, -96, wingSpan * 0.35);
      ctx.quadraticCurveTo(-72, wingSpan * 0.18, -52, 8);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = charge > 0.15
        ? `rgba(185, 95, 255, ${0.25 + charge * 0.65})`
        : 'rgba(55, 70, 105, 0.38)';
      ctx.lineWidth = 1.6;

      ctx.beginPath();
      ctx.moveTo(12, 6);
      ctx.bezierCurveTo(20, 65, -15, 130, -68, wingSpan);
      ctx.stroke();

      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(2, 36);
      ctx.quadraticCurveTo(-35, 85, -88, wingSpan * 0.65);
      ctx.moveTo(-8, 26);
      ctx.quadraticCurveTo(-45, 52, -96, wingSpan * 0.35);
      ctx.stroke();

      ctx.fillStyle = '#1b2030';
      ctx.beginPath();
      ctx.moveTo(10, 56);
      ctx.lineTo(22, 66);
      ctx.lineTo(6, 68);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    ctx.restore();
  }

  // رسم جسم أبو سن الانسيابي مع الزعانف الظهرية المتوهجة
  function drawToothlessBody(x, y, angle, index, total, scale, charge) {
    const t = index / total;
    let radius;
    if (t < 0.25) {
      radius = (11 + Math.sin((t / 0.25) * Math.PI) * 5) * scale;
    } else {
      radius = Math.max(2.2, (1 - (t - 0.25) / 0.75) * 12.5) * scale;
    }

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    const bodyGrad = ctx.createRadialGradient(0, -radius * 0.3, 1, 0, 0, radius);
    bodyGrad.addColorStop(0, '#22283b');
    bodyGrad.addColorStop(0.7, '#0b0d14');
    bodyGrad.addColorStop(1, '#05060a');

    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, radius * 1.15, radius, 0, 0, Math.PI * 2);
    ctx.fill();

    if (index === 23) {
      for (let side of [-1, 1]) {
        ctx.save();
        ctx.scale(1, side);
        ctx.fillStyle = '#090b12';
        ctx.strokeStyle = charge > 0.2 ? `rgba(180, 90, 255, ${charge * 0.7})` : 'rgba(60, 75, 110, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(6 * scale, radius * 0.6);
        ctx.quadraticCurveTo(-8 * scale, radius * 3.2, -22 * scale, radius * 2.5);
        ctx.quadraticCurveTo(-12 * scale, radius * 1.2, -10 * scale, radius * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    if (index % 2 === 1 && index < total - 3) {
      const spineSize = Math.max(2.5, (1 - t * 0.7) * 6.5) * scale;
      ctx.save();
      if (charge > 0.08) {
        ctx.shadowColor = '#b84dff';
        ctx.shadowBlur = 12 * charge;
        ctx.fillStyle = `rgba(${140 + charge * 115}, ${80 + charge * 130}, 255, ${0.4 + charge * 0.6})`;
      } else {
        ctx.fillStyle = '#1d2336';
      }
      ctx.beginPath();
      ctx.ellipse(0, 0, spineSize * 1.2, spineSize * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }

  // رسم ذيل أبو سن الشهير: زعنفة سوداء + الزعنفة الصناعية الحمراء لحازوقا
  function drawToothlessTailFins(x, y, angle, scale, charge) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(scale, scale);

    ctx.fillStyle = '#090b12';
    ctx.strokeStyle = charge > 0.2 ? `rgba(185, 95, 255, ${charge * 0.75})` : 'rgba(65, 80, 115, 0.45)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(8, -2);
    ctx.bezierCurveTo(-6, -24, -28, -28, -42, -14);
    ctx.quadraticCurveTo(-24, -8, -14, -1);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    const redGrad = ctx.createLinearGradient(8, 2, -40, 24);
    redGrad.addColorStop(0, '#b81d24');
    redGrad.addColorStop(0.6, '#8a1117');
    redGrad.addColorStop(1, '#59090d');

    ctx.fillStyle = redGrad;
    ctx.strokeStyle = '#ff6b6b';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(8, 2);
    ctx.bezierCurveTo(-6, 24, -28, 28, -42, 14);
    ctx.quadraticCurveTo(-24, 8, -14, 1);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = 'rgba(30, 20, 20, 0.75)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(4, 2); ctx.lineTo(-26, 20);
    ctx.moveTo(0, 2); ctx.lineTo(-34, 14);
    ctx.stroke();

    ctx.restore();
  }

  // رسم قذائف البلازما الأرجوانية والانفجارات وتيارات الهواء
  function updateAndDrawPlasma(scale) {
    const drawWingStream = (trail) => {
      if (trail.length < 2) return;
      for (let i = 1; i < trail.length; i++) {
        const r = i / trail.length;
        ctx.beginPath();
        ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
        ctx.lineTo(trail[i].x, trail[i].y);
        ctx.strokeStyle = trail[i].charged
          ? `rgba(195, 110, 255, ${r * 0.35})`
          : `rgba(130, 175, 255, ${r * 0.16})`;
        ctx.lineWidth = r * 3.5;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    };
    drawWingStream(wingTrailsL);
    drawWingStream(wingTrailsR);

    for (let i = sonicRings.length - 1; i >= 0; i--) {
      const sr = sonicRings[i];
      sr.radius += 3.2;
      sr.x += Math.cos(sr.angle) * 2.5;
      sr.y += Math.sin(sr.angle) * 2.5;
      sr.alpha -= 0.045;
      if (sr.alpha <= 0) {
        sonicRings.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.translate(sr.x, sr.y);
      ctx.rotate(sr.angle);
      ctx.scale(0.45, 1);
      ctx.strokeStyle = `rgba(215, 120, 255, ${sr.alpha})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, sr.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = plasmaBolts.length - 1; i >= 0; i--) {
      const b = plasmaBolts[i];
      b.history.push({ x: b.x, y: b.y });
      if (b.history.length > 14) b.history.shift();

      b.x += b.vx;
      b.y += b.vy;

      for (let j = 1; j < b.history.length; j++) {
        const ratio = j / b.history.length;
        ctx.beginPath();
        ctx.moveTo(b.history[j - 1].x, b.history[j - 1].y);
        ctx.lineTo(b.history[j].x, b.history[j].y);
        ctx.strokeStyle = `rgba(185, 65, 255, ${ratio * 0.85})`;
        ctx.lineWidth = b.radius * 1.4 * ratio;
